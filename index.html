<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f4f2">
  <title>.</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f4f4f2;
    }
    form { margin: 0; }
    input {
      width: 112px;
      height: 46px;
      padding: 8px 13px;
      border: 1px solid #c8c8c3;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #222;
      box-shadow: 0 2px 10px rgb(0 0 0 / 5%);
      font: 20px/1 system-ui, sans-serif;
      text-align: center;
      letter-spacing: .25em;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus {
      border-color: #999;
      box-shadow: 0 0 0 3px rgb(0 0 0 / 6%);
    }
    input:disabled { opacity: .65; }
  </style>
</head>
<body>
  <form id="unlock-form" novalidate>
    <input id="password" name="password" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" autocapitalize="none" spellcheck="false" autofocus>
  </form>

  <script>
    (() => {
      'use strict';

      const form = document.getElementById('unlock-form');
      const input = document.getElementById('password');
      const encoder = new TextEncoder();

      function resetInput() {
        input.disabled = false;
        input.value = '';
        input.focus();
      }

      function fromBase64(value, label) {
        if (typeof value !== 'string' || !/^[A-Za-z0-9+/]*={0,2}$/.test(value)) throw new Error(label + ' 형식이 올바르지 않습니다.');
        let binary;
        try { binary = atob(value); } catch { throw new Error(label + ' 형식이 올바르지 않습니다.'); }
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function validateEnvelope(envelope) {
        if (!envelope || envelope.format !== 'locked-html' || envelope.version !== 1) throw new Error('지원하지 않는 암호화 파일입니다.');
        if (!envelope.kdf || envelope.kdf.name !== 'PBKDF2' || envelope.kdf.hash !== 'SHA-256') throw new Error('지원하지 않는 키 생성 방식입니다.');
        if (!Number.isInteger(envelope.kdf.iterations) || envelope.kdf.iterations < 100000 || envelope.kdf.iterations > 2000000) throw new Error('암호화 반복 횟수가 안전 범위를 벗어났습니다.');
        if (!envelope.cipher || envelope.cipher.name !== 'AES-GCM' || envelope.cipher.tagLength !== 128) throw new Error('지원하지 않는 암호화 방식입니다.');
        return {
          salt: fromBase64(envelope.kdf.salt, 'salt'),
          iv: fromBase64(envelope.cipher.iv, 'iv'),
          encrypted: fromBase64(envelope.data, 'data')
        };
      }

      function aadFor(envelope) {
        return encoder.encode([
          envelope.format, envelope.version, envelope.kdf.name, envelope.kdf.hash,
          envelope.kdf.iterations, envelope.cipher.name, envelope.cipher.tagLength
        ].join('|'));
      }

      function ensureNoIndex(html) {
        if (/<meta\s+[^>]*name=["']robots["']/i.test(html)) return html;
        return html.replace(/<head(\s[^>]*)?>/i, match => match + '\n  <meta name="robots" content="noindex,nofollow,noarchive">');
      }

      async function loadEnvelope() {
        const response = await fetch('./game.enc', { cache: 'no-store', credentials: 'same-origin' });
        if (!response.ok) throw new Error('game.enc 파일을 불러오지 못했습니다. 업로드 여부를 확인하세요.');
        const text = await response.text();
        if (text.length > 30000000) throw new Error('암호화 파일이 너무 큽니다.');
        try { return JSON.parse(text); } catch { throw new Error('game.enc 파일 형식이 올바르지 않습니다.'); }
      }

      async function unlock(password) {
        const envelope = await loadEnvelope();
        const { salt, iv, encrypted } = validateEnvelope(envelope);
        if (salt.length !== 16 || iv.length !== 12 || encrypted.length < 17) throw new Error('암호화 파일이 손상되었습니다.');

        const passwordBytes = encoder.encode(password.normalize('NFKC'));
        try {
          const keyMaterial = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: envelope.kdf.iterations },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
          const clearBytes = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv, additionalData: aadFor(envelope), tagLength: 128 },
            key,
            encrypted
          );
          const html = new TextDecoder('utf-8', { fatal: true }).decode(clearBytes);
          if (!/<html(?:\s|>)/i.test(html)) throw new Error('복호화된 내용이 HTML이 아닙니다.');
          return ensureNoIndex(html);
        } finally {
          passwordBytes.fill(0);
        }
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!/^[0-9]{4}$/.test(input.value) || !window.crypto || !crypto.subtle) {
          resetInput();
          return;
        }

        input.disabled = true;
        try {
          const html = await unlock(input.value);
          input.value = '';
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          console.error(error);
          resetInput();
        }
      });
    })();
  </script>
</body>
</html>
